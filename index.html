<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>May — Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #02060E; --line: rgba(47, 155, 255, 0.38); --line-strong: #1F8FEA;
    --glow: #3DC8FF; --ice: #D6F4FF; --dim: #6FA8D6; --alert: #FF7A6B;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; color: var(--ice);
    background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(20, 90, 190, 0.25), transparent 70%), var(--void);
    font: 500 16px/1.4 'Rajdhani', system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    position: relative; width: 100%; max-width: 340px; padding: 18px 18px 14px; text-align: center;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(8, 44, 98, 0.34), rgba(3, 14, 32, 0.6));
  }
  .card::before, .card::after { content: ''; position: absolute; width: 14px; height: 14px; border: 2px solid var(--glow); }
  .card::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .card::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
  h1 { margin: 0 0 16px; font: 700 14px/1 'Orbitron', sans-serif; letter-spacing: 0.3em; text-shadow: 0 0 10px rgba(61, 200, 255, 0.7); }
  .dial {
    position: relative; width: 104px; height: 104px; margin: 0 auto 14px; border-radius: 50%;
    border: 2px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 18px rgba(61, 200, 255, 0.3), inset 0 0 22px rgba(61, 200, 255, 0.18);
    transition: border-color .3s, background .3s;
  }
  .dial::before {
    content: ''; position: absolute; inset: -9px; border-radius: 50%;
    border: 2px dashed rgba(61, 200, 255, 0.5); animation: spin 16s linear infinite;
  }
  .dial svg { width: 38px; height: 38px; fill: none; stroke: var(--glow); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dial.loading::before { animation-duration: 3s; }
  .dial.listening { border-color: var(--glow); }
  .dial.active { background: rgba(61, 200, 255, 0.22); animation: pulse 1.2s ease-in-out infinite; }
  .dial.busy svg { animation: blink .8s ease-in-out infinite; }
  .dial.error { border-color: var(--alert); }
  .dial.error::before { border-color: var(--alert); animation: none; }
  .dial.error svg { stroke: var(--alert); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .status { margin: 0 0 8px; min-height: 2.8em; font-size: 16px; line-height: 1.4; }
  .status.bad { color: var(--alert); }
  .meter { height: 6px; margin: 0 0 10px; border: 1px solid var(--line); background: rgba(3, 14, 32, 0.8); }
  .meter i { display: block; height: 100%; width: 0; background: var(--glow); box-shadow: 0 0 8px var(--glow); }
  .heard { margin: 0 0 10px; min-height: 1.4em; font-size: 14px; color: var(--dim); font-style: italic; overflow-wrap: anywhere; }
  button {
    margin: 0 0 12px; padding: 9px 20px; cursor: pointer;
    font: 600 15px/1 'Rajdhani', sans-serif; letter-spacing: 0.06em;
    color: var(--ice); background: rgba(31, 143, 234, 0.18); border: 1px solid var(--line-strong);
  }
  button:hover { border-color: var(--glow); }
  button[hidden] { display: none; }
  .note { margin: 0 0 8px; font-size: 13.5px; line-height: 1.45; color: var(--dim); }
  .debug { margin: 0; font-size: 11px; line-height: 1.4; color: var(--dim); opacity: 0.75; overflow-wrap: anywhere; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; } }
</style>
</head>
<body>
  <div class="card">
    <h1>MAY &middot; VOICE</h1>
    <div class="dial loading" id="dial">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
    </div>
    <p class="status" id="status" aria-live="polite">Starting&hellip;</p>
    <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
    <p class="heard" id="heard"></p>
    <button id="actionBtn" type="button" hidden>Tap to start</button>
    <p class="note">Keep this window open. Say &ldquo;Hey, May&rdquo;, speak, then say &ldquo;over&rdquo;. Listening happens inside this window &mdash; no audio is sent to any speech service.</p>
    <p class="debug" id="debug"></p>
  </div>

<script>
(function () {
  'use strict';

  // Speech recognition runs INSIDE this page, using a small English model
  // (Whisper "tiny") through Transformers.js. That is deliberate: Brave
  // ships without the cloud speech service other Chromium browsers use,
  // so the built-in browser feature cannot work there. The first run
  // downloads the engine and model (tens of megabytes) and the browser
  // keeps them for next time. See DECISIONS.md, ADR-19.
  var ENGINE_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';
  var SAMPLE_RATE = 16000;
  var FRAME_SIZE = 4096;            // 256 ms of audio per frame
  var END_SILENCE_FRAMES = 3;       // ~0.8 s of quiet ends a spoken phrase
  var MAX_SEGMENT_FRAMES = 100;     // ~25 s safety cut-off
  var ACTIVE_TIMEOUT_MS = 60000;    // give up 1 minute after the last thing heard

  // The dashboard puts its own address in the link that opens this window
  // (?o=...), so words are only ever addressed to the page that opened us.
  // "null" means that page's origin is opaque, where "*" is the only option
  // — acceptable because the only thing ever sent is the user's own spoken
  // sentence, and only to window.opener.
  var params = new URLSearchParams(window.location.search);
  var openerOrigin = params.get('o') || '';
  var sendTarget = (openerOrigin && openerOrigin !== 'null') ? openerOrigin : '*';

  // Default is the small, fast model. Adding ?model=base to the voice address in the
  // Settings sheet switches to a larger, more accurate one (bigger one-time download,
  // slower to transcribe).
  var MODELS = { tiny: 'Xenova/whisper-tiny.en', base: 'Xenova/whisper-base.en' };
  var MODEL_ID = MODELS[params.get('model')] || MODELS.tiny;

  var dial = document.getElementById('dial');
  var statusEl = document.getElementById('status');
  var meterFill = document.getElementById('meterFill');
  var heardEl = document.getElementById('heard');
  var actionBtn = document.getElementById('actionBtn');
  var debugEl = document.getElementById('debug');

  var state = 'loading';           // loading | awaiting_wake | active | error
  var paused = false;              // true while May is speaking a reply
  var lastError = '';
  var transcriber = null;
  var audioCtx = null;
  var actionHandler = null;

  // audio segmentation
  var noiseFloor = 0.004;
  var preRoll = [];
  var speech = [];
  var inSpeech = false;
  var silentFrames = 0;
  var loudCount = 0;

  // transcription queue and conversation state
  var queue = [];
  var busy = false;
  var messageParts = [];
  var activeTimer = null;

  function msg(e) {
    if (!e) return 'unknown error';
    if (e.name && e.message) return e.name + ': ' + e.message;
    return e.message || e.name || String(e);
  }

  function showDebug() {
    var bits = ['origin: ' + window.location.origin, 'model: ' + MODEL_ID];
    if (!window.opener) bits.push('not opened from the dashboard');
    if (lastError) bits.push('last error: ' + lastError);
    debugEl.textContent = bits.join(' \u00b7 ');
  }

  function setStatus(text, bad) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (bad ? ' bad' : '');
  }

  function setState(next) {
    state = next;
    dial.className = 'dial ' + ({ loading: 'loading', awaiting_wake: 'listening', active: 'active', error: 'error' }[next] || '');
    if (next === 'awaiting_wake') setStatus('Listening for \u201cHey, May\u201d\u2026');
    else if (next === 'active') setStatus('Listening \u2014 say \u201cover\u201d when you are done.');
    showDebug();
  }

  function offerAction(label, handler) {
    actionBtn.textContent = label;
    actionBtn.hidden = false;
    actionHandler = handler;
  }
  actionBtn.addEventListener('click', function () {
    actionBtn.hidden = true;
    if (actionHandler) actionHandler();
  });

  function fail(text, buttonLabel, handler) {
    lastError = text;
    setState('error');
    setStatus(text, true);
    if (buttonLabel) offerAction(buttonLabel, handler);
    showDebug();
  }

  // ---- Steps 1 and 2: load the engine and the model ----
  var fileProgress = {};
  function onProgress(p) {
    if (p && p.status === 'progress' && p.total) {
      fileProgress[p.file] = { loaded: p.loaded, total: p.total };
      var loaded = 0, total = 0;
      for (var k in fileProgress) { loaded += fileProgress[k].loaded; total += fileProgress[k].total; }
      setStatus('Step 2 of 3 \u2014 downloading the speech model\u2026 ' + Math.round(loaded / total * 100) + '%');
    }
  }

  async function loadEngine() {
    setStatus('Step 1 of 3 \u2014 loading the speech engine\u2026');
    var tf;
    try {
      tf = await import(ENGINE_URL);
    } catch (e) {
      throw new Error('could not load the speech engine from cdn.jsdelivr.net (' + msg(e) + '). If Brave Shields is blocking it, turn Shields off for this page.');
    }
    tf.env.allowLocalModels = false;

    async function build(useProxy) {
      try {
        tf.env.backends.onnx.wasm.numThreads = 1;
        tf.env.backends.onnx.wasm.proxy = useProxy; // keeps heavy work off the page so audio is never dropped
      } catch (e) { /* builds may not expose this; the defaults are fine */ }
      var t = await tf.pipeline('automatic-speech-recognition', MODEL_ID, { device: 'wasm', progress_callback: onProgress });
      setStatus('Step 2 of 3 \u2014 testing the speech engine\u2026');
      await t(new Float32Array(SAMPLE_RATE)); // one second of silence: warms it up and proves it works
      return t;
    }

    setStatus('Step 2 of 3 \u2014 downloading the speech model\u2026');
    try {
      return await build(true);
    } catch (first) {
      lastError = 'worker mode failed (' + msg(first) + '), retrying without it';
      showDebug();
      return await build(false);
    }
  }

  // ---- Step 3: the microphone ----
  async function startAudio() {
    setState('loading');
    setStatus('Step 3 of 3 \u2014 starting the microphone\u2026');
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    } catch (e) {
      if (e && e.name === 'NotFoundError') return fail('No microphone was found (' + e.name + ').', 'Try again', startAudio);
      return fail('The microphone is blocked (' + msg(e) + '). Click the padlock next to the address, set Microphone to Allow, then try again.', 'Try again', startAudio);
    }
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
      var source = audioCtx.createMediaStreamSource(stream);
      var processor = audioCtx.createScriptProcessor(FRAME_SIZE, 1, 1);
      var silent = audioCtx.createGain();
      silent.gain.value = 0; // keeps the processor running without playing anything back
      source.connect(processor);
      processor.connect(silent);
      silent.connect(audioCtx.destination);
      processor.onaudioprocess = onAudio;
    } catch (e2) {
      return fail('Could not set up audio capture (' + msg(e2) + ').', 'Try again', startAudio);
    }
    await resumeAudio();
  }

  async function resumeAudio() {
    try { await audioCtx.resume(); } catch (e) { /* handled below */ }
    if (audioCtx.state === 'running') {
      actionBtn.hidden = true;
      setState('awaiting_wake');
    } else {
      // Browsers only start audio after a real tap inside this window.
      setStatus('Ready \u2014 tap the button to start listening.');
      offerAction('Tap to start listening', resumeAudio);
    }
  }

  // ---- Cutting the stream into spoken phrases ----
  function onAudio(ev) {
    if ((state !== 'awaiting_wake' && state !== 'active') || paused) return;
    var input = ev.inputBuffer.getChannelData(0);
    var frame = new Float32Array(input.length);
    frame.set(input);
    var sum = 0;
    for (var i = 0; i < frame.length; i++) sum += frame[i] * frame[i];
    var rms = Math.sqrt(sum / frame.length);
    meterFill.style.width = Math.min(100, Math.round(rms * 900)) + '%';

    var loud = rms > Math.max(0.012, noiseFloor * 3.5);
    if (!inSpeech) {
      if (!loud) noiseFloor = noiseFloor * 0.95 + rms * 0.05;
      preRoll.push(frame);
      if (preRoll.length > 2) preRoll.shift();
      if (loud) {
        inSpeech = true; loudCount = 1; silentFrames = 0;
        speech = preRoll.slice(); preRoll = [];
      }
    } else {
      speech.push(frame);
      if (loud) { loudCount++; silentFrames = 0; } else { silentFrames++; }
      if (silentFrames >= END_SILENCE_FRAMES || speech.length >= MAX_SEGMENT_FRAMES) endSegment();
    }
  }

  function resetCapture() {
    preRoll = []; speech = []; inSpeech = false; silentFrames = 0; loudCount = 0; queue = [];
  }

  function endSegment() {
    var frames = speech, loud = loudCount;
    speech = []; inSpeech = false; silentFrames = 0; loudCount = 0;
    if (loud < 2) return; // a click or a cough, not speech
    var total = 0;
    frames.forEach(function (f) { total += f.length; });
    var audio = new Float32Array(total), offset = 0;
    frames.forEach(function (f) { audio.set(f, offset); offset += f.length; });
    if (queue.length >= 3) queue.shift();
    queue.push(audio);
    pump();
  }

  async function pump() {
    if (busy) return;
    busy = true;
    dial.classList.add('busy');
    while (queue.length) {
      var audio = queue.shift();
      try {
        var out = await transcriber(audio);
        handleText(((out && out.text) || '').trim());
      } catch (e) {
        lastError = 'transcription failed: ' + msg(e);
        showDebug();
      }
    }
    busy = false;
    dial.classList.remove('busy');
  }

  // ---- Understanding what was said ----
  // The small model sometimes writes sound effects like [BLANK_AUDIO] or
  // invents "Thank you." from silence — drop those.
  function clean(t) {
    return t.replace(/\[[^\]]*\]|\([^)]*\)|\*[^*]*\*/g, ' ').replace(/\s+/g, ' ').trim();
  }
  var SILENCE_INVENTIONS = /^(thank you\.?|thanks for watching\.?|you\.?|bye\.?|\.+)$/i;
  // The small model often mishears the short phrase "Hey, May" (for example as
  // "Hear me"). The exact phrase is accepted anywhere; the looser look-alikes only
  // at the very start of a phrase, so ordinary sentences are less likely to wake it.
  var WAKE_STRICT = /\b(?:hey|hay|hi)[\s,.!-]*(?:may|mae|mei|maye)\b/i;
  var WAKE_LOOSE = /^[\s"'(\[]*(?:hey|hay|hi|he|hear|ay|eh)[\s,.!-]*(?:may|mae|mei|maye|me|mea|mia|my)\b/i;
  var ENDS_WITH_OVER = /^(.*?)[\s,.!?;:-]*\bover\b[\s.!?,]*$/i;

  function handleText(raw) {
    var text = clean(raw);
    heardEl.textContent = text ? 'Heard: \u201c' + text + '\u201d' : '';
    if (!text || paused) return;

    if (state === 'awaiting_wake') {
      var m = text.match(WAKE_STRICT) || text.match(WAKE_LOOSE);
      if (!m) return;
      enterActive();
      var rest = text.slice(m.index + m[0].length).replace(/^[\s,.!?-]+/, '');
      if (rest) addToMessage(rest);
    } else if (state === 'active') {
      if (SILENCE_INVENTIONS.test(text) && !messageParts.length) return;
      addToMessage(text);
    }
  }

  function enterActive() {
    messageParts = [];
    setState('active');
    armTimeout();
  }

  function armTimeout() {
    clearTimeout(activeTimer);
    activeTimer = setTimeout(function () {
      if (state === 'active') {
        messageParts = [];
        setState('awaiting_wake');
        heardEl.textContent = 'Timed out \u2014 say \u201cHey, May\u201d to start again.';
      }
    }, ACTIVE_TIMEOUT_MS);
  }

  function addToMessage(text) {
    messageParts.push(text);
    var m = messageParts.join(' ').match(ENDS_WITH_OVER);
    if (m) {
      clearTimeout(activeTimer);
      messageParts = [];
      setState('awaiting_wake');
      var message = m[1].trim();
      if (message) sendToMay(message);
    } else {
      armTimeout();
    }
  }

  function sendToMay(message) {
    heardEl.textContent = 'Sent: \u201c' + message + '\u201d';
    if (window.opener) {
      try {
        window.opener.postMessage({ type: 'may-voice-message', text: message }, sendTarget);
      } catch (e) { /* the dashboard was closed */ }
    } else {
      setStatus('Heard you, but this window was not opened from May\u2019s dashboard \u2014 open it from the mic button there.', true);
    }
  }

  // The dashboard tells us when May is speaking a reply aloud, so we stop
  // listening for a moment — otherwise her voice through the speakers could
  // be mistaken for a new "Hey, May."
  window.addEventListener('message', function (event) {
    if (!window.opener || event.source !== window.opener || !event.data) return;
    if (event.data.type === 'may-is-speaking') { paused = true; resetCapture(); }
    else if (event.data.type === 'may-done-speaking') { paused = false; resetCapture(); }
  });

  // ---- Go ----
  async function boot() {
    setState('loading');
    showDebug();
    try {
      transcriber = await loadEngine();
    } catch (e) {
      return fail('The speech engine could not start: ' + msg(e), 'Try again', function () { window.location.reload(); });
    }
    await startAudio();
  }
  boot();
})();
</script>
</body>
</html>
